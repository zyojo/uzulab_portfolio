name: Preview

# PR ごとに Worker Preview（pr-<番号>）を作り、URL を PR にコメントする。PR を閉じたら削除する。
# 本番へのデプロイは手動（pnpm run deploy）
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Enable corepack (pnpm)
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build and deploy preview
        id: preview
        run: |
          pnpm astro build
          pnpm wrangler preview --name "pr-${{ github.event.pull_request.number }}" --json > preview.json
          grep -o 'https://[^"]*workers\.dev' preview.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Comment preview URL
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            // --json でも前にログ行が混ざるので、行頭の { 以降だけを読む
            const text = fs.readFileSync('preview.json', 'utf8')
            const out = JSON.parse(text.slice(text.search(/^\{/m)))
            const marker = '<!-- worker-preview -->'
            const body = [
              marker,
              '### Preview',
              '',
              `- 最新: ${out.preview?.urls?.[0] ?? '(URL を取得できませんでした。Actions のログを確認してください)'}`,
              `- このコミット: ${out.deployment?.urls?.[0] ?? '-'}`,
              '',
              'データベースと画像は本番と共通です。',
            ].join('\n')
            const { owner, repo } = context.repo
            const issue_number = context.payload.pull_request.number
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number })
            const existing = comments.find((c) => c.body?.includes(marker))
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body })
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body })
            }

  cleanup:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Enable corepack (pnpm)
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Delete preview
        run: pnpm wrangler preview delete --name "pr-${{ github.event.pull_request.number }}" || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
